name: Test Dotfiles Installation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-unix:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed-file whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Install zsh for template smoke tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Install Chezmoi test binary
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render templates and check shell syntax
        run: bash tests/smoke-unix.sh

  smoke-windows:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed-file whitespace
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Install Chezmoi test binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bin" | Out-Null
          iex "& { $(irm https://get.chezmoi.io/ps1) } -b '$env:RUNNER_TEMP\bin'"
          "$env:RUNNER_TEMP\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Render templates and check PowerShell syntax
        shell: pwsh
        run: ./tests/smoke-windows.ps1

  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflow YAML
        uses: docker://rhysd/actionlint:1.7.7

  linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04-lite
            family: ubuntu
            version: "22.04"
            dockerfile: LinuxUbuntu
            mode: lite
            lite: "true"
            gui: "false"
          - name: ubuntu-22.04-full-cli
            family: ubuntu
            version: "22.04"
            dockerfile: LinuxUbuntu
            mode: full-cli
            lite: "false"
            gui: "false"
          - name: ubuntu-24.04-lite
            family: ubuntu
            version: "24.04"
            dockerfile: LinuxUbuntu
            mode: lite
            lite: "true"
            gui: "false"
          - name: ubuntu-24.04-full-cli
            family: ubuntu
            version: "24.04"
            dockerfile: LinuxUbuntu
            mode: full-cli
            lite: "false"
            gui: "false"
          - name: ubuntu-26.04-lite
            family: ubuntu
            version: "26.04"
            dockerfile: LinuxUbuntu
            mode: lite
            lite: "true"
            gui: "false"
          - name: ubuntu-26.04-full-cli
            family: ubuntu
            version: "26.04"
            dockerfile: LinuxUbuntu
            mode: full-cli
            lite: "false"
            gui: "false"
          - name: rocky-8-lite
            family: rocky
            version: "8"
            dockerfile: LinuxRocky8
            mode: lite
            lite: "true"
            gui: "false"
          - name: rocky-8-full-cli
            family: rocky
            version: "8"
            dockerfile: LinuxRocky8
            mode: full-cli
            lite: "false"
            gui: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: |
          docker build \
            --build-arg UBUNTU_VERSION=${{ matrix.version }} \
            --tag dotfiles-${{ matrix.name }} \
            --file tests/${{ matrix.dockerfile }}/Dockerfile .

      - name: Apply twice and verify ${{ matrix.name }}
        env:
          CASE_NAME: ${{ matrix.name }}
          LITE: ${{ matrix.lite }}
          GUI: ${{ matrix.gui }}
          MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          container="dotfiles-${CASE_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --name "$container" \
            --env DOTFILES_INSTALL_LOG=/tmp/install.log \
            --env LITE --env GUI --env MODE \
            --volume "$GITHUB_WORKSPACE/tests:/tests:ro" \
            "dotfiles-${CASE_NAME}" bash -lc '
              exec bash /tests/ci/run-linux.sh "$MODE" "$LITE" "$GUI"
            ' 2>&1 | tee "$RUNNER_TEMP/${CASE_NAME}.log"

      - name: Remove test container
        if: always()
        run: |
          container="dotfiles-${{ matrix.name }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$container" 2>/dev/null || true

      - name: Upload failed installation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.log
          if-no-files-found: warn

  linux-edge-cases:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root-no-sudo
            user: root
            home: /root
          - name: unprivileged-no-sudo
            user: nosudo
            home: /home/nosudo
          - name: optional-package-failure
            user: root
            home: /root
    steps:
      - uses: actions/checkout@v4

      - name: Build Ubuntu 24.04 edge-case image
        run: |
          docker build --build-arg UBUNTU_VERSION=24.04 \
            --tag dotfiles-edge-${{ matrix.name }} \
            --file tests/LinuxUbuntu/Dockerfile .

      - name: Verify an existing non-uv command is preserved
        if: matrix.name == 'optional-package-failure'
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" \
            dotfiles-edge-${{ matrix.name }} \
            bash /repo/tests/test-python-tool-conflict.sh

      - name: Exercise ${{ matrix.name }}
        env:
          EDGE_CASE: ${{ matrix.name }}
          TEST_HOME: ${{ matrix.home }}
        run: |
          set -o pipefail
          container="dotfiles-edge-${EDGE_CASE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --name "$container" --user "${{ matrix.user }}" \
            --workdir "$TEST_HOME" \
            --env HOME="$TEST_HOME" --env USER="${{ matrix.user }}" \
            --env EDGE_CASE \
            --volume "$GITHUB_WORKSPACE/tests:/tests:ro" \
            "dotfiles-edge-${EDGE_CASE}" bash -lc '
              exec bash /tests/ci/run-edge-case.sh "$EDGE_CASE"
            ' 2>&1 | tee "$RUNNER_TEMP/${EDGE_CASE}.log"

      - name: Remove test container
        if: always()
        run: |
          container="dotfiles-edge-${{ matrix.name }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$container" 2>/dev/null || true

      - name: Upload failed installation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-edge-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.log
          if-no-files-found: warn

  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: lite
            lite: "true"
            gui: "false"
          - mode: full-cli
            lite: "false"
            gui: "false"
          - mode: full-gui
            lite: "false"
            gui: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Chezmoi test binary
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Apply twice and verify macOS ${{ matrix.mode }}
        env:
          LITE: ${{ matrix.lite }}
          GUI: ${{ matrix.gui }}
          MODE: ${{ matrix.mode }}
          DOTFILES_INSTALL_LOG: ${{ runner.temp }}/macos-${{ matrix.mode }}.log
        run: |
          bash tests/ci/run-macos.sh "$MODE" "$LITE" "$GUI" \
            "$GITHUB_WORKSPACE" "$DOTFILES_INSTALL_LOG"

      - name: Upload failed installation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-macos-${{ matrix.mode }}
          path: ${{ runner.temp }}/macos-${{ matrix.mode }}.log
          if-no-files-found: warn

  windows:
    # Full modes remain opt-in because they install a substantial tool set.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["lite","full-cli","full-gui"]' || '["lite"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply as a temporary standard user
        shell: pwsh
        env:
          MODE: ${{ matrix.mode }}
          LITE: ${{ matrix.mode == 'lite' }}
          GUI: ${{ matrix.mode == 'full-gui' }}
        run: |
          ./tests/ci/run-windows.ps1 -Mode $env:MODE -Lite $env:LITE -Gui $env:GUI `
            -Source $env:GITHUB_WORKSPACE -LogDirectory 'C:\dotfiles-ci-logs' `
            -TaskName "dotfiles-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

      - name: Clean up temporary Windows user
        if: always()
        shell: pwsh
        run: |
          Get-ScheduledTask -TaskName "dotfiles-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            -ErrorAction SilentlyContinue | Unregister-ScheduledTask -Confirm:$false
          Remove-LocalUser -Name 'dotfiles-ci' -ErrorAction SilentlyContinue

      - name: Upload failed installation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-windows-${{ matrix.mode }}
          path: C:/dotfiles-ci-logs/windows-${{ matrix.mode }}.log
          if-no-files-found: warn

  wsl:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: lite
            lite: "true"
          - mode: full-cli
            lite: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Import Ubuntu 24.04 and run ${{ matrix.mode }}
        shell: pwsh
        env:
          MODE: ${{ matrix.mode }}
          LITE: ${{ matrix.lite }}
        run: |
          ./tests/ci/run-wsl.ps1 -Mode $env:MODE -Lite $env:LITE `
            -Source $env:GITHUB_WORKSPACE -TempDirectory $env:RUNNER_TEMP `
            -Distro "dotfiles-$env:MODE-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"

      - name: Unregister ephemeral WSL distribution
        if: always()
        shell: pwsh
        env:
          MODE: ${{ matrix.mode }}
        run: |
          $distro = "dotfiles-$env:MODE-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ((wsl --list --quiet) -contains $distro) {
              wsl --unregister $distro
          }

      - name: Upload failed installation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-wsl-${{ matrix.mode }}
          path: ${{ runner.temp }}/wsl-${{ matrix.mode }}.log
          if-no-files-found: warn
